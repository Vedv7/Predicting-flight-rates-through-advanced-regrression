[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-prices"
version = "0.1.0"
description = "India domestic flight fare regression — library, training CLI, and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Veda Swaroop" }]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "xgboost>=2.0,<4",
  "openpyxl>=3.1,<4",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.4,<1"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3"]

[project.scripts]
flight-train = "flight_prices.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
